<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src = "etch.js" defer></script>
    <link rel = "stylesheet" href="etch.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EtchSketch</title>
</head>
<body>
    <div class = "main">
        <div class="options">
            <label for="color">Color for Etching:</label>
            <input type="color" id="color" value="#000000">

            <button class="button ToggleRainbow">Toggle Rainbow effect</button>
            <label for = "slide">Resolution</label>
            <input type="range" id ="slide" min="2" max="100">
            <button class="button Theme">Theme</button>
            <button class="button Lines">Toggle Lines</button>
        </div>

        <div class="sketch">

        </div>
    </div>
</body>
</html>
